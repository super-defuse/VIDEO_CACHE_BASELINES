cache_root: artifacts/cache
max_cache_bytes: 5368709120
retrieval:
  nirvana_vid:
    # NIRVANA and Chorus share whole-prompt CLIP/Chroma top-1 retrieval.
    backend: clip
    model_id: openai/clip-vit-large-patch14
    device: cuda:0
    vector_backend: chroma
    min_similarity: 0.65
    reuse_step: 10
  chai:
    # Reference CHAI uses one LongCLIP vector per spaCy NOUN token.
    backend: longclip
    longclip_checkpoint: models/longclip/longclip-L.pt
    longclip_module: model.longclip
    device: cuda:0
    # CHAI specifies FAISS 1.13 for its entity vector database.
    vector_backend: faiss
    spacy_model: en_core_web_sm
    # Names match chai/opensora/chai.py: search on read, deduplicate on write.
    sim_thres_for_search: 0.90
    sim_thres_for_add: 0.95
  chorus:
    # Chorus uses 768-d CLIP prompt embeddings and cosine top-1 retrieval.
    backend: clip
    model_id: openai/clip-vit-large-patch14
    device: cuda:0
    # Chorus specifies a persistent ChromaDB index for prompt embeddings.
    vector_backend: chroma
    min_similarity: 0.65
    # The paper only specifies that F(score, N) is monotonic. This is a
    # documented linear approximation for the existing 50-step Wan path.
    stage_scheduler:
      min_k1: 10
      min_k2: 40
      max_k1: 30
      max_k2: 45
  carnator:
    # Shares CLIP/Chroma prompt ranking with NIRVANA and Chorus, then applies
    # local entity filtering and the native step-5 online-signature gate.
    backend: clip
    model_id: openai/clip-vit-large-patch14
    device: cuda:0
    vector_backend: chroma
    min_similarity: 0.65
    candidate_top_k: 20
    stage2_candidate_top_k: 5
    spacy_model: en_core_web_sm
    # Temporary operational value: formal labeled-pair calibration may replace it.
    max_latent_distance: 0.15
    # Single-noun substitutions stay fail-closed until their two mask gates are calibrated.
chorus:
  stages:
    # Engineering schedule for the 50-step Wan2.2 run; Chorus does not
    # publish numeric K1/K2 values.
    k1: 10
    k2: 40
  gamma_k: 1.15
  gamma_o: 1.05
  joint_gamma_1_6:
    gamma_k: 1.30
    gamma_o: 1.30
  joint_gamma_2_1:
    gamma_k: 1.6
    gamma_o: 1.6
  joint_gamma_2_0:
    gamma_k: 2.0
    gamma_o: 2.0
  # The paper does not specify a block subset; run the TGAA hook on every
  # Wan block and audit the actual call count in the request metadata.
  tgaa_blocks: all
  # F_k(t,m) and F_o(t,m) are not published. The adapter keeps its
  # step-only linear decay as an explicitly labeled approximation.
  tgaa_schedule: linear_step_decay_approximation
  mask_dilation_edit: 8
  mask_dilation_see: 14
  grounded_sam2:
    release: v1.0
    commit: dd4c514
    root: external/grounded-sam2
    checkpoint_dir: models/Grounded-SAM-2-v1.0
    device: cuda
    hf_endpoint: https://hf-mirror.com
    box_threshold: 0.35
    text_threshold: 0.25
    sam_checkpoint: sam2.1_hiera_large.pt
    sam_config: configs/sam2.1/sam2.1_hiera_l.yaml
    groundingdino_checkpoint: groundingdino_swint_ogc.pth
    groundingdino_config: GroundingDINO_SwinT_OGC.py
