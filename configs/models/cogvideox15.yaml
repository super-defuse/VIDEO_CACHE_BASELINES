# Put the checkpoint under models/, or replace this with an absolute path.
model: cogvideox15
model_path: models/CogVideoX1.5-5B
device: cuda:0
dtype: bfloat16
width: 1360
height: 768
frames: 81
fps: 16
baseline_steps: 50
seed: 20260218
guidance_scale: 6.0
teacache:
  relative_l1_threshold: 0.5
  max_skip_steps: 2
nirvana_vid:
  reuse_start_step: 5
  cache_steps: [5]
chorus2:
  sparse_start_step: 10
  q_block_size: 128
  k_block_size: 128
  top_p: 0.95
  min_top_k: 0.1
  layer_refresh_size: 8
  layers: all
carnator_b5:
  probe_step: 5
  reuse_step: 10
  regional_layers: 14-27
  outer_sparse_layers: 0-13,28-41
  q_block_size: 128
  k_block_size: 128
  top_p: 0.95
  min_top_k: 0.1
  # Fusion mask: the step-5 joint-attention probe proposes the noun seeds and
  # the self-attention contrast turns them into Mbase.  Nothing here segments a
  # decoded frame, so no source video has to be encoded.
  attention_probe_layer: 15
  # Must be 15 or later: the contrast reads the seeds the cross score produces
  # earlier in the same transformer forward.
  attention_self_layer: 15
  mask_top_p: 0.02
  mask_background_p: 0.02
  fusion_eps: 0.2
  fusion_gamma: 1.0
  fusion_high_threshold: 0.45
  fusion_low_threshold: 0.35
  mask_spatial_medit_radius: 2
  mask_spatial_msee_radius: 3
  # Target-side reuse, same vocabulary as the Wan/LTX Carnator baselines.
  latent_injection_mode: boundary-blend
  boundary_alpha_function: smoothstep
  ffn_backend: w8a8

