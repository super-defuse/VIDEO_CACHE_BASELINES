# Put the checkpoint under models/, or replace this with an absolute path.
model: wan21
model_path: models/Wan2.1-T2V-1.3B
wan_source: external/Wan2.1
wan_config_key: t2v-1.3B
wan_version: 2.1
device: cuda:0
dtype: bfloat16
width: 1280
height: 704
frames: 121
baseline_steps: 50
fast_steps: 8
seed: 20260218
guidance_scale: 5.0
shift: 5.0
solver: unipc
source_cache_steps: [1, 2, 3, 4]
cache_attention:
  blocks: [0]
  steps: [1, 2, 3, 4]
teacache:
  relative_l1_threshold: 0.08
  max_skip_steps: 2
nirvana_vid:
  reuse_start_step: 5
  cache_steps: [5]
chorus:
  stages: {k1: 5, k2: 30}       # target executes 50 - K1 = 45 steps, latent fusion on [K1, K2)
  gamma_k: 1.5
  gamma_o: 1.5
# Chorus2 / Carnator constants that differ from the shared carnator parser
# defaults are listed here; every other constant (probe/reuse steps, layer
# ranges, mask quantiles, block sizes) is the parser default, which is also the
# value used by the Wan2.2 experiment. See WAN21_README.md for the full table.
chorus2:
  sparse_start_step: 10        # masks captured/served from completed step 11
  layer_refresh_size: 8
  outer_backend: sparge-sage2
carnator_b5:
  # Soft (B5) latent fusion: base keeps the target, the band blends towards the
  # source latent with a smoothstep alpha, everything outside is the source.
  latent_injection_mode: boundary-blend
  boundary_alpha_function: smoothstep
  outer_backend: sparge-sage2
  ffn_backend: w8a8
